# 로컬 개발용 PostgreSQL 한 대를 띄운다.
#
# SQLite는 파일 하나였지만 PostgreSQL은 "따로 실행되는 서버 프로그램"이다.
# 맥에 직접 설치하는 대신 도커 컨테이너로 띄우면 버전과 설정이 이 파일에 남아
# 다른 컴퓨터에서도 똑같이 재현할 수 있다.
#
#   docker compose up -d      # 시작 (-d = 백그라운드)
#   docker compose ps         # 상태 확인
#   docker compose down       # 정지 (데이터는 남는다)
#   docker compose down -v    # 정지 + 데이터까지 삭제
services:
  postgres:
    image: postgres:18-alpine
    container_name: readlog-postgres
    restart: unless-stopped
    environment:
      # 이 세 값은 컨테이너가 "처음 만들어질 때"만 쓰인다.
      # 나중에 바꾸려면 down -v로 데이터를 지우고 다시 만들어야 한다.
      POSTGRES_USER: readlog
      POSTGRES_PASSWORD: readlog
      POSTGRES_DB: readlog
    ports:
      # "호스트포트:컨테이너포트". 맥의 5432로 들어온 접속을 컨테이너로 넘긴다.
      # 맥에 이미 PostgreSQL이 떠 있다면 여기를 "5433:5432"로 바꾼다.
      - '5432:5432'
    volumes:
      # 컨테이너를 지워도 데이터가 남도록 이름 붙인 저장 공간에 연결한다.
      #
      # 경로에 주의. PostgreSQL 18부터 도커 이미지의 규칙이 바뀌었다.
      #   17 이하: /var/lib/postgresql/data 에 마운트
      #   18 이상: /var/lib/postgresql      에 마운트
      # 18 이미지는 이 폴더 안에 18/docker 같은 버전별 하위 폴더를 스스로 만든다.
      # 그래야 나중에 pg_upgrade로 메이저 버전을 올릴 수 있기 때문이다.
      # 옛 경로를 쓰면 컨테이너가 뜨자마자 죽고 재시작을 반복한다.
      - readlog-postgres-data:/var/lib/postgresql
    healthcheck:
      # "떴다"와 "접속을 받을 준비가 됐다"는 다르다. 준비 상태를 실제로 확인한다.
      test: ['CMD-SHELL', 'pg_isready -U readlog -d readlog']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  readlog-postgres-data:
